# =============================================================================
# ADA POSSEBON — trecho para o VirtualHost HTTPS EXISTENTE do POSSEBON Web (Apache 2.4)
# Publica a ADA em https://<DOMINIO_POSSEBON>/ada/ (MESMO SITE do POSSEBON → cookie SameSite=Lax
# funciona dentro do iframe e não depende de cookies de terceiros).
#
# Pré-requisitos: a2enmod proxy proxy_http headers
# NÃO aplicar sem revisão do responsável pela infraestrutura. Preencha <...>.
# =============================================================================

# Dentro de <VirtualHost *:443> ... </VirtualHost> do POSSEBON:

    ProxyPreserveHost On
    ProxyRequests Off

    # Eventos em tempo real (SSE): sem buffer e com timeout longo
    ProxyPass        /ada/api/ada/notifications/stream http://127.0.0.1:4800/ada/api/ada/notifications/stream flushpackets=on timeout=3600
    ProxyPassReverse /ada/api/ada/notifications/stream http://127.0.0.1:4800/ada/api/ada/notifications/stream

    # Aplicação e API (o Node escuta SOMENTE em 127.0.0.1)
    ProxyPass        /ada/ http://127.0.0.1:4800/ada/ timeout=120
    ProxyPassReverse /ada/ http://127.0.0.1:4800/ada/
    RedirectMatch 301 ^/ada$ /ada/

    <Location /ada/>
        RequestHeader set X-Forwarded-Proto "https"
        # A ADA envia sua própria política de incorporação (CSP frame-ancestors restrita à origem oficial).
        # Se o vhost do POSSEBON define X-Frame-Options globalmente, remova-o SOMENTE nesta rota:
        Header always unset X-Frame-Options
        # Limite de corpo coerente com ADA_UPLOAD_MAX_MB (20 MB) + folga
        LimitRequestBody 22020096
    </Location>

    # Rotas servidor-servidor da ADA não devem ser alcançáveis pela internet:
    <Location /ada/api/ada/internal/>
        Require ip 127.0.0.1 ::1 <IP_DO_SERVIDOR_POSSEBON_SE_DIFERENTE>
    </Location>

# Alternativa por subdomínio (ex.: ada.<dominio>): mesmo bloco em um VirtualHost próprio.
# Atenção: subdomínio do MESMO domínio registrável continua "same-site" (SameSite=Lax funciona).
# Um domínio diferente exigiria ADA_COOKIE_SAMESITE=None e é bloqueado por navegadores que restringem
# cookies de terceiros — não recomendado.
