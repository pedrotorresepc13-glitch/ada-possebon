# POSSO - atalho HTTPS /posso, sem alterar o backend /ada existente.
# Trecho opcional para o VirtualHost *:443 do Apache 2.4.
# NAO esta instalado: aplicar somente apos validar no servidor.
# COMPATIBILIDADE: o bundle atual usa base /ada para assets e API e o SSO
# continua dependendo da identidade POSSEBON Web. Esse alias, isoladamente,
# NAO implementa login independente quando o backend PHP estiver indisponivel.

ProxyRequests Off
ProxyPreserveHost On

# NUNCA publicar endpoints internos pelo alias.
ProxyPass /posso/api/ada/internal/ !
<Location /posso/api/ada/internal/>
    Require all denied
</Location>

# Encaminha apenas a entrada alternativa ao mesmo processo POSSO.
# O backend permanece 127.0.0.1:4800/ada; cookies e APIs seguem em /ada.
ProxyPass        /posso/ http://127.0.0.1:4800/ada/ timeout=120
ProxyPassReverse /posso/ http://127.0.0.1:4800/ada/
RedirectMatch 308 ^/posso$ /posso/

# Etapa seguinte OBRIGATORIA para independencia total do MAD Builder:
# provedor de identidade e permissoes diretamente no PostgreSQL (ou IdP
# corporativo) com autenticacao forte e revogacao; nao ativar logins sintéticos.
