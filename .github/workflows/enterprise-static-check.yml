name: HOLO Enterprise - verificação estática
on:
  push:
    branches: [main, 'feat/enterprise-studio-mvp-ptbr']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos módulos
        run: |
          node --input-type=module --check < studio/app.js
          node --input-type=module --check < studio/demo.js
          node --check services/assistant-server.mjs
          node --check services/holo-companion.mjs
          node --input-type=module --check < studio/companion.js
          node --check tests/companion.test.mjs
          node --check tests/gesture-engine.test.mjs
      - name: Testar gestos sintéticos (sem webcam)
        run: node tests/gesture-engine.test.mjs
      - name: Testar a assistente local (sem Ollama, webcam ou dados reais)
        run: node tests/companion.test.mjs
      - name: Confirmar arquivos do deploy
        run: |
          test -s index.html
          test -s studio/style.css
          test -s vendor/three.module.js
          test -s vendor/vision_bundle.mjs
          test -s vendor/hand_landmarker.task
          python3 -m json.tool vercel.json >/dev/null

  windows-installer-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar a sintaxe PowerShell sem instalar nada
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('tools/Instalar-HOLO.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          # Evita o bug real: function Winget -> chamada recursiva a winget.
          $functions = @($tokens | Where-Object { $_.Kind -eq 'Identifier' })
          $functionDefs = @([System.Management.Automation.Language.Parser]::ParseFile('tools/Instalar-HOLO.ps1', [ref]$null, [ref]$null).FindAll({ param($a) $a -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true))
          if ($functionDefs | Where-Object { $_.Name -ieq 'winget' }) {
            throw 'Recursao: funcao Winget mascara winget.exe no PowerShell.'
          }
          $script = Get-Content tools/Instalar-HOLO.ps1 -Raw
          if ($script -notmatch 'function Install-UsingWinget' -or -not $script.Contains('& winget.exe @args')) {
            throw 'Instalador deve invocar winget.exe de forma explicita.'
          }
          if ($script -notmatch 'OLLAMA_MODELS' -or $script -notmatch 'HOLO_LOCAL_DATA_DIR' -or $script -notmatch 'D:\\HOLO') {
            throw 'Configuracao de armazenamento no D: nao encontrada.'
          }
